<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishLens</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <div class="header">

            <h1>PhishLens</h1>

            <p>
                AI-Assisted Phishing Investigation Platform
            </p>

        </div>

        <div class="upload-box">

            <input type="file" id="emailFile">

            <div class="button-group">

                <button id="analyzeBtn">
                    Analyze Email
                </button>

                <button id="exportBtn">
                    Export Report
                </button>

                <button id="loadCasesBtn">
                    Investigation History
                </button>

            </div>

        </div>

        <div class="section">

            <h2>
                Investigation Report
            </h2>

            <pre id="resultText">
No analysis yet.
            </pre>

        </div>

        <div class="section">

            <h2>
                Stored Investigations
            </h2>

            <div id="casesContainer">

            </div>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
